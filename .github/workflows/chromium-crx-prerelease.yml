name: Build Chromium Android CRX prerelease

on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: affo-chromium-prerelease
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: write
    env:
      RELEASE_TARGET: chromium

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm

      - name: Check required secrets and create build configuration
        env:
          GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
          CHROMIUM_CRX_PRIVATE_KEY_PEM: ${{ secrets.CHROMIUM_CRX_PRIVATE_KEY_PEM }}
        run: node .github/scripts/prepare-release-config.cjs

      - name: Install dependencies and validate
        run: |
          npm ci
          npm run lint
          npm run lint:workflows
          npm test

      - name: Locate native CRX packer
        run: |
          packer="$(command -v google-chrome)"
          echo "AFFO_CHROMIUM_CRX_PACKER=$packer" >> "$GITHUB_ENV"
          "$packer" --version

      - name: Build Chromium MV3 source
        run: |
          trap 'node scripts/set-debug.js true' EXIT
          node scripts/set-debug.js false
          npm run build:chromium

      - name: Reserve next version and retain five reservation tags
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          export RELEASE_REVISION_FLOOR="$((GITHUB_RUN_NUMBER + 100))"
          node .github/scripts/prepare-release.cjs ztemp/chromium-mv3-src/manifest.json

      - name: Pack versioned CRX
        run: npm run pack:chromium-crx -- --out "web-ext-artifacts/a-font-face-off-chromium-mv3-${RELEASE_VERSION}.crx"

      - name: Retain signed package before publishing
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: chromium-${{ steps.version.outputs.version }}
          path: web-ext-artifacts/a-font-face-off-chromium-mv3-${{ steps.version.outputs.version }}.crx
          if-no-files-found: error
          retention-days: 30

      - name: Publish rolling prerelease, download link, and local QR image
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/publish-release.cjs "web-ext-artifacts/a-font-face-off-chromium-mv3-${RELEASE_VERSION}.crx"

      - name: Keep five newest signed release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/prune-release-assets.cjs

      - name: Remove CRX signing key
        if: always()
        run: |
          node -e "require('node:fs').rmSync('ztemp/chromium-mv3-key.pem', { force: true })"
