name: Sign Firefox Android XPI prerelease

on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: affo-firefox-prerelease
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: write
    env:
      RELEASE_TARGET: firefox

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm

      - name: Check required secrets and create build configuration
        env:
          GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: node .github/scripts/prepare-release-config.cjs

      - name: Install dependencies and validate
        run: |
          npm ci
          npm run lint
          npm run lint:workflows
          npm test

      - name: Build deterministic Firefox package
        run: |
          npm run build -- --filename affo-firefox.zip
          mkdir -p ztemp/firefox-signing-source
          unzip -q web-ext-artifacts/affo-firefox.zip -d ztemp/firefox-signing-source
          test -f ztemp/firefox-signing-source/manifest.json

      - name: Install signing tool and validate packaged extension
        run: |
          npm install --prefix ztemp/signing-tools --no-save --package-lock=false web-ext@10.6.0
          ztemp/signing-tools/node_modules/.bin/web-ext lint --source-dir ztemp/firefox-signing-source --self-hosted

      - name: Reserve next version and retain five reservation tags
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          export RELEASE_REVISION_FLOOR="$((GITHUB_RUN_NUMBER + 100))"
          node .github/scripts/prepare-release.cjs ztemp/firefox-signing-source/manifest.json

      - name: Sign through Mozilla and name the XPI
        env:
          WEB_EXT_API_KEY: ${{ secrets.AMO_JWT_ISSUER }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          ztemp/signing-tools/node_modules/.bin/web-ext sign --channel unlisted \
            --source-dir ztemp/firefox-signing-source \
            --artifacts-dir ztemp/signed --approval-timeout 1200000
          files=(ztemp/signed/*.xpi)
          test "${#files[@]}" -eq 1 && test -f "${files[0]}"
          mv "${files[0]}" "ztemp/signed/a-font-face-off-${RELEASE_VERSION}.xpi"

      - name: Retain signed package before publishing
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: firefox-${{ steps.version.outputs.version }}
          path: ztemp/signed/a-font-face-off-${{ steps.version.outputs.version }}.xpi
          if-no-files-found: error
          retention-days: 30

      - name: Publish rolling prerelease, download link, and local QR image
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/publish-release.cjs "ztemp/signed/a-font-face-off-${RELEASE_VERSION}.xpi"

      - name: Keep five newest signed release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/prune-release-assets.cjs
